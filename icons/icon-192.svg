<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F06292"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCE4EC" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <!-- Flower petals -->
  <g transform="translate(96,92)">
    <ellipse cx="0" cy="-24" rx="14" ry="24" fill="url(#petal)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="24" fill="url(#petal)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="24" fill="url(#petal)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="24" fill="url(#petal)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="24" fill="url(#petal)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="24" fill="url(#petal)" transform="rotate(300)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="10" fill="#FFD54F"/>
    <circle cx="0" cy="0" r="6" fill="#FFC107"/>
  </g>
  <!-- Text -->
  <text x="96" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">ARIMBI</text>
</svg>