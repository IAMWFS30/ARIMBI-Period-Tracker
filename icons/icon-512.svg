<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F06292"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCE4EC" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#880E4F" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Subtle pattern -->
  <circle cx="400" cy="100" r="80" fill="white" opacity="0.05"/>
  <circle cx="120" cy="420" r="60" fill="white" opacity="0.05"/>
  <!-- Flower -->
  <g transform="translate(256,230)" filter="url(#shadow)">
    <ellipse cx="0" cy="-62" rx="36" ry="62" fill="url(#petal)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-62" rx="36" ry="62" fill="url(#petal)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-62" rx="36" ry="62" fill="url(#petal)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-62" rx="36" ry="62" fill="url(#petal)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-62" rx="36" ry="62" fill="url(#petal)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-62" rx="36" ry="62" fill="url(#petal)" transform="rotate(300)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="26" fill="#FFD54F"/>
    <circle cx="0" cy="0" r="16" fill="#FFC107"/>
    <circle cx="-5" cy="-5" r="4" fill="#FFE082" opacity="0.7"/>
  </g>
  <!-- Brand text -->
  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="6">ARIMBI</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="20" fill="rgba(255,255,255,0.7)" letter-spacing="3">PERIOD TRACKER</text>
</svg>